<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ALPHA CLAN SECRET</title>
  <link rel="icon" href="images/alpha-clan-logo.png">
  <style>
    @font-face {
      font-family: "Compass";
      src: url("images/compass.ttf") format("truetype");
      font-display: swap;
    }
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }
    .roll {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }
    .gotcha {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 2;
      padding: 18px 16px 22px;
      font-family: "Compass", monospace;
      font-size: clamp(16px, 3.2vw, 34px);
      letter-spacing: 2px;
      text-align: center;
      color: #ffe066;
      text-shadow: 3px 3px 0 #3a1d08, -1px -1px 0 #3a1d08;
      background: linear-gradient(180deg, transparent, rgba(0, 0, 0, .85) 45%);
      pointer-events: none;
    }
    /* Knopf zurueck zu den Events */
    .back {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 3;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 9px 18px;
      font-family: "Compass", monospace;
      font-size: 15px;
      letter-spacing: 2px;
      text-decoration: none;
      color: #45260a;
      background: #d9a83c;
      border: 3px solid #8d5615;
      box-shadow: 0 4px 0 #0b0a10;
    }
    .back:hover  { background: #ffe066; }
    .back:active { transform: translateY(4px); box-shadow: none; }
    .back:focus-visible { outline: 3px solid #ffe066; outline-offset: 3px; }
  </style>
</head>
<body>
  <a class="back" href="events.html">&larr; BACK</a>
  <video class="roll" src="videos/rickroll.mp4" autoplay muted loop playsinline></video>
  <div class="gotcha">You just got rickrolled by the Alpha Clan... wow...</div>
</body>
</html>
